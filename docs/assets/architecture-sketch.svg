<svg xmlns="http://www.w3.org/2000/svg" width="830" height="310" viewBox="0 0 830 310" role="img" aria-labelledby="title desc">
  <title id="title">OrderPilot architecture (sketch)</title>
  <desc id="desc">A customer talks to a LangGraph agent. Inside it, an auth gate comes first, then a chat model that calls tools. Tools call the services, which read the database. An eval harness tests the agent.</desc>
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="3.2"/>
    </filter>
    <marker id="head" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#1e1e1e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", cursive; fill: #1e1e1e; }
      .t { font-size: 17px; font-weight: 700; }
      .s { font-size: 13px; fill: #495057; }
      .n { font-size: 12px; fill: #868e96; }
      .shape { stroke: #1e1e1e; stroke-width: 1.8; stroke-linejoin: round; }
      .wire { stroke: #1e1e1e; stroke-width: 1.6; fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="830" height="310" rx="14" fill="#ffffff"/>

  <!-- Shapes, roughened -->
  <g filter="url(#rough)">
    <!-- customer -->
    <rect x="20" y="82" width="110" height="50" rx="10" fill="none" class="shape"/>
    <!-- agent: auth gate -> model <-> tools -->
    <rect x="175" y="45" width="300" height="105" rx="12" fill="#e7f0ff" class="shape"/>
    <rect x="187" y="88" width="78" height="42" rx="8" fill="#fff9db" class="shape"/>
    <rect x="295" y="88" width="70" height="42" rx="8" fill="#ffffff" class="shape"/>
    <rect x="395" y="88" width="66" height="42" rx="8" fill="#ffffff" class="shape"/>
    <!-- services -->
    <rect x="552" y="70" width="148" height="76" rx="12" fill="#e6f6ec" class="shape"/>
    <!-- database -->
    <path d="M736 84 V140 A37 9 0 0 0 810 140 V84" fill="#fff4dd" class="shape"/>
    <ellipse cx="773" cy="84" rx="37" ry="9" fill="#fff4dd" class="shape"/>
    <!-- evals -->
    <rect x="210" y="230" width="230" height="60" rx="12" fill="#fde8f1" class="shape"/>

    <!-- wires -->
    <line x1="134" y1="107" x2="171" y2="107" class="wire" marker-start="url(#head)" marker-end="url(#head)"/>
    <line x1="268" y1="109" x2="291" y2="109" class="wire" marker-end="url(#head)"/>
    <line x1="368" y1="102" x2="391" y2="102" class="wire" marker-end="url(#head)"/>
    <line x1="391" y1="117" x2="368" y2="117" class="wire" marker-end="url(#head)"/>
    <line x1="479" y1="108" x2="548" y2="108" class="wire" marker-start="url(#head)" marker-end="url(#head)"/>
    <line x1="704" y1="110" x2="732" y2="110" class="wire" marker-start="url(#head)" marker-end="url(#head)"/>
    <line x1="325" y1="226" x2="325" y2="156" class="wire" stroke-dasharray="7 6" marker-end="url(#head)"/>
  </g>

  <!-- Labels, kept sharp -->
  <text x="75" y="113" text-anchor="middle" class="t" style="font-size:15px">Customer</text>

  <text x="325" y="72" text-anchor="middle" class="t">LangGraph agent</text>
  <text x="226" y="114" text-anchor="middle" class="s">auth gate</text>
  <text x="330" y="114" text-anchor="middle" class="s">model</text>
  <text x="428" y="114" text-anchor="middle" class="s">tools</text>

  <text x="626" y="114" text-anchor="middle" class="t">Services</text>

  <text x="773" y="122" text-anchor="middle" class="s" style="fill:#1e1e1e">Database</text>

  <text x="325" y="266" text-anchor="middle" class="t">Eval harness</text>
</svg>
