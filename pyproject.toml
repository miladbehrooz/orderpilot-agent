[project]
name = "orderpilot"
version = "0.1.0"
description = "OrderPilot: an evaluated e-commerce support agent built with LangGraph."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "loguru>=0.8.0",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.7.0",
    "pytest>=8.3",
    "pytest-mock>=3.17.0",
    "ruff>=0.8",
]
# Used only by scripts/build_db.py (CSV -> SQLite); the agent itself does not need pandas.
data = [
    "pandas>=2.2",
    "pandas-stubs>=2.2",
]

[tool.uv]
default-groups = ["dev", "data"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orderpilot"]

# ----------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
    "PTH",  # use pathlib
    "DTZ",  # naive datetimes (TODAY must come from the DB, never datetime.now())
    "RUF",  # ruff-specific
    "BLE",  # no blind `except Exception`
    "S110", # no try/except/pass
    "S112", # no try/except/continue
    "D",    # docstrings (Google style, see below)
]
ignore = [
    "D100", # module docstring: optional
    "D104", # package docstring: optional
    "D105", # magic methods (__repr__ etc.): optional
    "D107", # __init__: document args in the class docstring instead
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ----------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "evals", "scripts"]
mypy_path = "src:scripts"
explicit_package_bases = true
warn_unreachable = true
pretty = true

# ----------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"
